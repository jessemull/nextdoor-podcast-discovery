# CI: Lint, test, security, and build on PR and push to main/release.
# Playwright is installed only so scraper unit tests can run; the production scraper is not executed in GitHub Actions.
name: CI

on:
  pull_request:
    branches: [main, release]
  push:
    branches: [main, release]

jobs:
  # Required pre-merge: lint (includes format check), test, security, build.
  lint-test-security-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            scraper/requirements.txt
            scraper/requirements-dev.txt

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install scraper dependencies
        run: |
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r scraper/requirements.txt -r scraper/requirements-dev.txt

      - name: Install Playwright browsers (Chromium)
        run: cd scraper && ../.venv/bin/playwright install chromium

      - name: Install web dependencies
        run: cd web && npm ci --legacy-peer-deps

      - name: Format (auto-fix)
        run: make format

      - name: Lint (scraper + web, ESLint --fix in CI)
        run: make lint-ci

      - name: Test (scraper + web with coverage)
        run: make test-ci

      - name: Security (scraper + web)
        run: make security

      - name: Build web
        run: make build
